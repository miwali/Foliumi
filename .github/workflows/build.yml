name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Xcode disponibles
        run: |
          ls -d /Applications/Xcode*.app
          xcode-select -p

      - name: Archive avec plusieurs versions d'Xcode
        run: |
          set +e
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" -not -path "*/.git/*" | head -n1)
          echo "Projet : $PROJ"
          SUCCESS=0
          for APP in $(ls -d /Applications/Xcode_*.app | sort -Vr | head -n 4); do
            NAME=$(basename "$APP" .app)
            LOG="build-$NAME.log"
            echo "=============== $NAME ==============="
            sudo xcode-select -s "$APP/Contents/Developer"
            xcodebuild -version
            if ! xcodebuild -list -project "$PROJ" >/dev/null 2>&1; then
              echo "Format illisible : objectVersion abaissé à 77 (contournement)"
              find . -maxdepth 4 -name project.pbxproj -not -path "*/.git/*" \
                -exec sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 77;/' {} +
            fi
            rm -rf build
            xcodebuild archive \
              -project "$PROJ" \
              -scheme Folium \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              > "$LOG" 2>&1
            CODE=$?
            echo "Code retour : $CODE"
            if [ $CODE -eq 0 ] && [ -d build/App.xcarchive/Products/Applications ]; then
              echo "RÉUSSI avec $NAME"
              SUCCESS=1
              break
            fi
            echo "--- Erreurs ($NAME) ---"
            grep -E "error:" "$LOG" | grep -v "warning:" | head -n 8
          done
          if [ $SUCCESS -ne 1 ]; then
            echo "Aucune version d'Xcode n'a réussi."
            exit 1
          fi

      - name: Créer l'IPA
        run: |
          set -e
          APP=$(find build/App.xcarchive/Products -maxdepth 3 -name "*.app" | head -n1)
          echo "App trouvée : $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r Folium.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Folium-ipa
          path: Folium.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore
