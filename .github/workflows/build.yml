name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Choisir le plus récent Xcode installé
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Utilisé : $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Détecter projet et scheme
        id: detect
        run: |
          set -eo pipefail
          WS=$(find . -maxdepth 3 -name "*.xcworkspace" -not -path "*.xcodeproj/*" -not -path "*/Pods/*" | head -n1)
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n1)
          if [ -n "$WS" ]; then
            FLAG="-workspace"; TARGET="$WS"
          elif [ -n "$PROJ" ]; then
            FLAG="-project"; TARGET="$PROJ"
          else
            echo "Aucun .xcworkspace ni .xcodeproj trouvé"; exit 1
          fi
          if ! xcodebuild -list $FLAG "$TARGET" >/dev/null
