name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Choisir le plus récent Xcode installé
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          echo "Utilisé : $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Détecter projet et scheme
        id: detect
        run: |
          set -eo pipefail
          WS=$(find . -maxdepth 3 -name "*.xcworkspace" -not -path "*.xcodeproj/*" -not -path "*/Pods/*" | head -n1)
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" -not -path "*/Pods/*" | head -n1)
          if [ -n "$WS" ]; then
            FLAG="-workspace"; TARGET="$WS"
          elif [ -n "$PROJ" ]; then
            FLAG="-project"; TARGET="$PROJ"
          else
            echo "Aucun .xcworkspace ni .xcodeproj trouvé"; exit 1
          fi
          if ! xcodebuild -list $FLAG "$TARGET" >/dev/null 2>&1; then
            echo "Lecture impossible : on abaisse objectVersion à 77 (contournement)"
            find . -maxdepth 4 -name project.pbxproj -not -path "*/.git/*" \
              -exec sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 77;/' {} +
          fi
          xcodebuild -list $FLAG "$TARGET"
          SCHEME=$(xcodebuild -list -json $FLAG "$TARGET" | python3 -c "import sys,json; d=json.load(sys.stdin); k=d.get('workspace') or d.get('project'); print(k['schemes'][0])")
          echo "Utilisé : $FLAG $TARGET / scheme $SCHEME"
          echo "flag=$FLAG" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive (sans signature)
        run: |
          set -eo pipefail
          xcodebuild archive \
            ${{ steps.detect.outputs.flag }} "${{ steps.detect.outputs.target }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Créer l'IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r Folium.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Folium-ipa
          path: Folium.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
